services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-places_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine (for local tools / dev); not exposed to the internet.
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-places_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set in .env}
    volumes:
      - uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
    # No external ports, accessed via Caddy proxy internal network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.maplas.net}
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:

